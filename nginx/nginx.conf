events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Проксирование запросов в Django
        location / {
            proxy_pass http://web:8000;  # Важно: 'web' — имя сервиса в docker-compose.yml
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }

        # Раздача статики Django
        location /static/ {
            alias /habit_tracker/static/;  # Должно совпадать с STATIC_ROOT в settings.py
            expires 30d;
        }

        # Раздача медиафайлов (если используются)
        location /media/ {
            alias /habit_tracker/media/;
            expires 30d;
        }
    }
}
